<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Forever - Christian Matrimony</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* High-gloss Instagram-style deep berry gradient background */
            background: radial-gradient(circle at 50% 30%, #e60067 0%, #9e0047 45%, #590024 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            padding: 50px 20px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 35px;
            width: 100%;
        }

        /* --- ANIMATIONS --- */
        
        /* Smooth pop-up zoom in and out loop */
        @keyframes popZoomInOut {
            0% { transform: scale(0.85); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.2); }
            100% { transform: scale(0.85); filter: brightness(1); }
        }

        /* Heartbeat ripple effect */
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(255,255,255,0.6)); }
            20% { transform: scale(1.12); filter: drop-shadow(0 0 18px rgba(255,255,255,0.9)); }
            40% { transform: scale(1.03); filter: drop-shadow(0 0 10px rgba(255,255,255,0.7)); }
            60% { transform: scale(1.15); filter: drop-shadow(0 0 22px rgba(255,255,255,1)); }
        }

        /* Shimmer moving shine animation for unique glossy words */
        @keyframes textGlossShine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- WORD STYLING (EACH HAS A UNIQUE GLOSSY COLOR) --- */

        .title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: popZoomInOut 4.5s ease-in-out infinite;
        }

        /* "Love" - Bold White Neon Glow with thick stroke simulation */
        .word-love {
            font-family: 'Alex Brush', cursive;
            font-size: 5.5rem;
            font-weight: 900;
            color: #ffffff;
            line-height: 0.9;
            text-shadow: 
                0 0 10px #fff,
                0 0 25px rgba(255, 255, 255, 0.8),
                0 0 45px #ff2a85,
                0 0 70px #ff2a85;
        }

        /* "Forever" - Creamy Pink Pearl Gloss Chrome */
        .word-forever {
            font-family: 'Alex Brush', cursive;
            font-size: 5.5rem;
            font-weight: 900;
            line-height: 0.9;
            margin-top: -10px;
            background: linear-gradient(135deg, #ffffff 0%, #ffe3f0 40%, #ff73b3 70%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlossShine 3s linear infinite;
            filter: drop-shadow(0 4px 15px rgba(0,0,0,0.3));
        }

        /* Central Heart Vector Graphics */
        .heart-graphic {
            width: 120px;
            height: 120px;
            animation: heartBeat 2.5s ease-in-out infinite;
        }

        .subtitle-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 100%;
        }

        /* "CHRISTIAN" - Crisp Liquid Silver-White Gloss */
        .word-christian {
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ffffff 0%, #d1f7ff 40%, #aae7f5 70%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlossShine 3.5s linear infinite;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
        }

        /* "MATRIMONY" - Vivid Electric Turquoise Blue Metallic Gloss */
        .word-matrimony {
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(to right, #00ffff 0%, #40e0d0 30%, #ffffff 50%, #00bfff 70%, #00ffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlossShine 4s linear infinite;
            filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.6));
        }

        .footer-container {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        /* "Made" - Metallic Cyan-Blue Tinted Shimmer */
        .word-made {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(to right, #b3f0ff 0%, #00ced1 50%, #b3f0ff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlossShine 2.5s linear infinite;
        }

        /* "In" - Classic Bright Ice White Foil */
        .word-in {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ffffff 0%, #e6e6e6 50%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlossShine 2s linear infinite;
        }

        /* "India" - Rich Deep Turquoise Gemstone Gloss */
        .word-india {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(to right, #00ffff 0%, #008b8b 50%, #ffffff 80%, #00ffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlossShine 3s linear infinite;
            filter: drop-shadow(0 0 5px rgba(0, 255, 255, 0.5));
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="title-container">
            <span class="word-love">Love</span>
            <span class="word-forever">Forever</span>
        </div>

        <svg class="heart-graphic" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="3.5" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>
            <path d="M 50,35 
                     C 50,12 18,12 18,38 
                     C 18,61 46,80 50,84 
                     C 54,80 82,61 82,38 
                     C 82,12 50,12 50,35 Z" 
                  fill="none" 
                  stroke="#ffffff" 
                  stroke-width="5" 
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  filter="url(#neon-glow)" />
            <path d="M 25,52 Q 34,49 41,52 L 47,52 M 47,41 L 47,70 M 42,47 L 58,47 M 53,52 Q 62,55 75,50" 
                  fill="none" 
                  stroke="#ffffff" 
                  stroke-width="4.5" 
                  stroke-linecap="round" 
                  stroke-linejoin="round"
                  filter="url(#neon-glow)"/>
        </svg>

        <div class="subtitle-container">
            <span class="word-christian">Christian</span>
            <span class="word-matrimony">Matrimony</span>
        </div>
    </div>

    <div class="footer-container">
        <span class="word-made">Made</span>
        <span class="word-in">In</span>
        <span class="word-india">India</span>
    </div>

</body>
</html>
