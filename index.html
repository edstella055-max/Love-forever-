<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love Forever - Premium Splash Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* The original rich Instagram-style deep magenta-berry canvas */
            background: radial-gradient(circle at 50% 35%, #de106b 0%, #a6004c 50%, #540026 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            padding: 40px 16px; /* Safe padding for absolute device margins */
        }

        /* Core structure maximizing display flexibility without clipping */
        .viewport-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            max-width: 420px; /* Locks structure seamlessly within modern smartphone bounds */
            gap: 30px;
        }

        /* --- ANIMATIONS --- */

        /* Controlled Pop-up Zoom that safely keeps words inside the glass viewport */
        @keyframes safeNeonZoom {
            0% { transform: scale(0.88); }
            50% { transform: scale(1.02); } /* Kept tight so letters never overflow edges */
            100% { transform: scale(0.88); }
        }

        /* Pulsing core heart heartbeat */
        @keyframes heartPulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(255,255,255,0.7)); }
            30% { transform: scale(1.08); filter: drop-shadow(0 0 18px rgba(255, 105, 180, 0.9)); }
            60% { transform: scale(1.02); filter: drop-shadow(0 0 10px rgba(255,255,255,0.7)); }
        }

        /* Liquid metallic gold shimmer movement */
        @keyframes metallicGoldShine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- STYLING COMPONENTS --- */

        /* Main Heading Box configured to stay inside margins */
        .neon-title-container {
            width: 100%;
            text-align: center;
            animation: safeNeonZoom 4.5s ease-in-out infinite;
            padding: 0 10px;
        }

        /* "Love Forever" - Vibrant White Neon Script with safety fluid scaling */
        .brand-heading {
            font-family: 'Great Vibes', cursive;
            /* Fluid sizing: scales down elegantly on smaller devices like iPhone SE */
            font-size: min(14vw, 4.4rem); 
            color: #ffffff;
            white-space: nowrap; /* Prevents awkward multi-line breakage */
            line-height: 1.2;
            text-shadow: 
                0 0 8px rgba(255, 255, 255, 0.9),
                0 0 20px rgba(255, 20, 147, 0.8),
                0 0 40px rgba(255, 20, 147, 0.5),
                0 0 60px rgba(255, 20, 147, 0.3);
        }

        /* Icon Container */
        .center-graphic-container {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: heartPulseGlow 3s ease-in-out infinite;
        }

        /* High-Definition SVG matching original branding geometry */
        .neon-heart-cross {
            width: min(30vw, 125px);
            height: min(30vw, 125px);
        }

        /* --- THE NEW GLOSSY GOLD ELEMENTS --- */

        /* "CHRISTIAN MATRIMONY" - Luxury 24K Liquid Gold Foil */
        .glossy-gold-subtitle {
            font-size: min(4vw, 1.05rem);
            font-weight: 800;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
            
            /* High-fidelity moving gold gradient */
            background: linear-gradient(to right, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: metallicGoldShine 4s linear infinite;
            
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.3));
        }

        /* "MADE IN INDIA" - Clean Satin Champagne Gold */
        .glossy-gold-footer {
            font-size: min(3.2vw, 0.78rem);
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-align: center;
            margin-top: auto;
            padding-bottom: 10px;
            
            background: linear-gradient(to right, #ddc185 0%, #ffffff 50%, #b89754 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: metallicGoldShine 3s linear infinite;
            opacity: 0.95;
            filter: drop-shadow(0px 1px 3px rgba(0, 0, 0, 0.2));
        }
    </style>
</head>
<body>

    <div class="viewport-wrapper">
        
        <div class="neon-title-container">
            <h1 class="brand-heading">Love Forever</h1>
        </div>

        <div class="center-graphic-container">
            <svg class="neon-heart-cross" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="neon-glow-filter" x="-25%" y="-25%" width="150%" height="150%">
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow-filter)">
                    <path d="M 50,33 
                             C 50,13 18,13 18,38 
                             C 18,60 46,79 50,83 
                             C 54,79 82,60 82,38 
                             C 82,13 50,13 50,33 Z" 
                          stroke-width="5" />
                    <path d="M 23,52 Q 33,49 41,52 L 47,52 M 47,40 L 47,71 M 41,47 L 57,47 M 53,52 Q 62,55 77,49" 
                          stroke-width="4.5" />
                </g>
            </svg>
        </div>

        <h2 class="glossy-gold-subtitle">Christian Matrimony</h2>
        
    </div>

    <div class="glossy-gold-footer">
        Made in India
    </div>

</body>
</html>
