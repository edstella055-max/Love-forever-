<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marathi Protestant Matrimonial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styling & Theme Colors */
        :root {
            --mustard-yellow: #ca9611; 
            --mustard-dark: #a27507;
            --splash-gradient: radial-gradient(circle, #e0aa22, #a27507);
            --light-cream-bg: #faf7f0; 
            --border-color: #d8cdb6;
            --text-dark: #3a3224;
            --love-font: 'Great Vibes', cursive;
        }

        body { 
            font-family: 'Playfair Display', serif; 
            background-color: var(--light-cream-bg); 
            margin: 0; 
            padding-bottom: 70px; 
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* SCREEN 0: FRONT PAGE (SPLASH SCREEN) */
        #splashScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--splash-gradient);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000;
            transition: visibility 0.6s;
            overflow: hidden;
        }
        
        .splash-logo-box { text-align: center; }

        .splash-title-top {
            color: white; 
            font-family: var(--love-font);
            font-size: 4.5rem; 
            text-shadow: 0px 2px 4px rgba(0,0,0,0.15);
            margin: 0;
            display: block;
            opacity: 0;
            transform: scale(0.5);
            animation: zoomInAppear 1.2s ease-out forwards;
        }
        
        /* Pure white heart outline - no inside fill color */
        .heart-icon {
            display: inline-block;
            font-style: normal;
            font-weight: normal;
            color: white;
            animation: pulseHeart 1.5s infinite ease-in-out;
            margin-left: 5px;
        }

        .splash-title-sub {
            display: block;
            color: rgba(255,255,255,0.95);
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: -5px;
            opacity: 0;
            animation: fadeInSub 0.8s ease-in forwards;
            animation-delay: 0.9s;
        }

        /* FLOATING WHITE HEART OUTLINE POP-UP EFFECT */
        .match-heart-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 8rem;
            color: white; /* White outline character, middle is transparent */
            text-shadow: 0 0 8px rgba(0,0,0,0.3);
            z-index: 99999;
            pointer-events: none;
            opacity: 0;
        }

        .animate-popup-heart {
            animation: heartPopEffect 1s ease-out forwards;
        }

        /* ANIMATIONS */
        @keyframes heartPopEffect {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -70%) scale(0.8); opacity: 0; }
        }

        @keyframes zoomInAppear {
            0% { opacity: 0; transform: scale(0.5); }
            80% { opacity: 1; transform: scale(1.03); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        @keyframes fadeInSub {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseHeart {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .zoom-out-gone {
            animation: zoomOutExit 0.6s ease-in forwards !important;
            pointer-events: none;
        }
        
        @keyframes zoomOutExit {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(3); filter: blur(5px); }
        }

        /* MAIN APP HEADER */
        header {
            background-color: var(--mustard-yellow);
            color: white;
            text-align: center;
            padding: 10px 15px;
            font-family: var(--love-font);
            font-size: 2.8rem; 
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }

        .container { 
            max-width: 600px; 
            background: white; 
            padding: 20px; 
            margin: 15px auto; 
            border-radius: 8px; 
            box-shadow: 0px 4px 12px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        
        .app-page { display: none; }
        .app-page.active { display: block; }

        h2 { border-bottom: 2px solid var(--border-color); padding-bottom: 5px; color: var(--mustard-yellow); font-size: 1.3rem; margin-top: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #5a4f3b; font-size: 0.95rem; }
        input, select { font-family: sans-serif; width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; box-sizing: border-box; background-color: #fffdfa; color: var(--text-dark); }
        input:disabled, select:disabled { background-color: #f1ede4; cursor: not-allowed; }
        
        .slider-container { display: flex; align-items: center; gap: 15px; }
        .slider-val { font-weight: bold; color: var(--mustard-dark); min-width: 60px; }

        .btn { background-color: var(--mustard-yellow); color: white; padding: 12px; border: none; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-accept { background-color: var(--mustard-yellow); color: white; padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-decline { background-color: #e4dec3; color: #5a4f3b; padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }

        /* BOTTOM NAVBAR */
        .navbar {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background-color: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 500;
        }
        .nav-item {
            background: none; border: none;
            color: #8c826e; font-size: 0.85rem; font-weight: bold;
            cursor: pointer; display: flex; flex-direction: column; align-items: center;
        }
        .nav-item.active { color: var(--mustard-yellow); }
        .nav-icon { font-size: 1.4rem; margin-bottom: 2px; }

        .photo-container { text-align: center; margin-bottom: 20px; }
        .profile-img-frame { width: 130px; height: 130px; border-radius: 50%; border: 3px solid var(--mustard-yellow); object-fit: cover; background: #fdfaf2; display: inline-block; }
        .photo-actions { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
        .file-input-label { background: var(--mustard-yellow); color: white; padding: 6px 12px; border-radius: 4px; font-size: 0.85rem; cursor: pointer; font-weight: bold; }

        .chat-card { border: 1px solid var(--border-color); padding: 15px; border-radius: 6px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; background-color: #fffdfa; }
        .chat-info h4 { margin: 0 0 5px 0; color: var(--mustard-yellow); }
        .chat-info p { margin: 0; font-size: 0.9rem; color: #6e6450; }
        
        .premium-card { border: 2px solid var(--mustard-yellow); background: #fffef7; padding: 20px; border-radius: 8px; text-align: center; }
        .premium-price { font-size: 1.8rem; font-weight: bold; color: var(--mustard-dark); margin: 10px 0; }
        .features-list { text-align: left; margin: 15px auto; max-width: 80%; padding-left: 20px; color: #5a4f3b; }

        .matches-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .match-card { background: #fffdfa; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; text-align: center; }
        .match-thumb { width: 100%; height: 140px; background-color: #eee9dc; border-radius: 6px; object-fit: cover; }
        .match-name { font-weight: bold; margin: 8px 0 3px 0; color: var(--mustard-yellow); }
        .match-meta { font-size: 0.85rem; color: #6e6450; margin-bottom: 8px; }
    </style>
</head>
<body>

<div id="heartPopup" class="match-heart-popup">♡</div>

<div id="splashScreen">
    <div class="splash-logo-box">
        <span class="splash-title-top">Love Forever <span class="heart-icon">♡</span></span>
        <span class="splash-title-sub">Marathi Christian Protestant</span>
    </div>
</div>

<header id="appHeader">Love Forever <span class="heart-icon">♡</span></header>

<div id="page-home" class="container app-page active">
    <div class="photo-container">
        <img id="profileDisplay" class="profile-img-frame" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%23ca9611'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" alt="Profile Picture">
        <div class="photo-actions">
            <label class="file-input-label" id="uploadLabel">Add Photo<input type="file" id="photoLoader" accept="image/*" style="display: none;" onchange="addProfilePhoto(this)"></label>
            <button type="button" class="btn-decline" id="removePhotoBtn" onclick="removeProfilePhoto()" style="display:none; padding:6px 12px; font-size:0.85rem;">Remove</button>
        </div>
    </div>

    <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
        <button id="editToggleBtn" class="btn-accept" onclick="toggleProfileEdit()">Edit Profile</button>
    </div>

    <form id="profileForm">
        <h2>My Information</h2>
        <div class="form-group"><label>Community Group</label><input type="text" value="Marathi Christian Protestant" disabled style="font-weight: bold; color: var(--mustard-dark); background-color: #fdfbf7;"></div>
        <div class="form-group"><label>Full Name</label><input type="text" id="pName" value="Your Full Name" disabled></div>
        <div class="form-group"><label>Contact Number</label><input type="tel" id="pContact" value="9876543210"
