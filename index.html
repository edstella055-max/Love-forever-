<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Forever - Splash Screen</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        /* Reset and Base Layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Premium Soft Luxe Gradient: Deep royal plum to elegant dusty rose */
            background: linear-gradient(135deg, #2b082c 0%, #7d1c4a 50%, #c97d93 100%);
            background-size: 400% 400%;
            /* Calm 'love in the air' background shifting */
            animation: gradientMove 10s ease infinite;
        }

        /* Relaxed Background Shimmer Animation */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Center Content Alignment Container */
        .splash-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 25px;
        }

        /* App Name: Scaled perfectly with an eye-friendly soft rose-gold glow */
        .app-name {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.5rem, 15vw, 3.6rem); 
            font-weight: normal;
            color: #ffffff;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
            white-space: nowrap;
            
            /* Softer, warm luxury glow instead of harsh piercing neon */
            text-shadow: 
                0 0 8px rgba(255, 255, 255, 0.9), 
                0 0 15px #ffb3d1, 
                0 0 25px #ffb3d1;
            
            /* Smooth pop out zoom in/out animation */
            animation: pulseZoom 4s ease-in-out infinite;
        }

        /* Intertwined Faith-Heart-Cross Logo Container */
        .logo-container {
            margin-bottom: 35px;
            animation: pulseZoom 4s ease-in-out infinite;
        }

        /* Logo Stroke & Calm Rose Glow Customization */
        .heart-cross-svg {
            width: 120px;
            height: 120px;
            /* Applied the same relaxed, eye-comforting glow to the vector icon */
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9)) 
                    drop-shadow(0 0 12px #ffb3d1);
        }

        /* Shared Continuous Zoom Animation (Slightly slowed down for eye comfort) */
        @keyframes pulseZoom {
            0%, 100% { transform: scale(0.96); }
            50% { transform: scale(1.04); }
        }

        /* Subtitles: Matte Premium Champagne Gold Typography */
        .sub-title {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1rem;
            color: #f7dca6; /* Beautiful matte gold */
            font-weight: 600;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            margin-top: 5px;
        }

        /* Bottom Fixed Footer Stamp */
        .footer-text {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: absolute;
            bottom: 40px;
            color: #f7dca6;
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.85;
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <h1 class="app-name">Love Forever</h1>
        
        <div class="logo-container">
            <svg class="heart-cross-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M60,40 
                         C42,15 12,27 18,57 
                         C22,75 42,92 60,105 
                         C78,92 98,75 102,57 
                         C108,27 78,15 60,40 Z" 
                      stroke="#ffffff" 
                      stroke-width="4.5" 
                      stroke-linecap="round" 
                      stroke-linejoin="round"/>
                
                <path d="M32,65 
                         C37,65 40,53 43,53 C45,53 43,65 47,65 C52,65 52,58 55,54 C58,50 56,65 61,65 C66,65 66,58 70,58 
                         M40,58 L46,58 
                         M70,45 L70,85 
                         M62,55 L78,55 
                         M76,65 C82,65 85,58 90,62" 
                      stroke="#ffffff" 
                      stroke-width="4" 
                      stroke-linecap="round" 
                      stroke-linejoin="round"/>
            </svg>
        </div>

        <div class="sub-title">Christian Matrimony</div>
    </div>

    <div class="footer-text">Made in India</div>

</body>
</html>
