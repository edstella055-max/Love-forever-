<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Forever - App Front Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* 1. Instagram Teal-to-Purple Glossy Background */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: 
                /* Subtle glass reflections */
                linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 60%),
                /* Base teal blue gradient */
                radial-gradient(circle at 50% 30%, #00d2ff 0%, #3a7bd5 50%, #001f3f 100%),
                /* Bottom right purple glow */
                radial-gradient(circle at 100% 100%, #c0392b 0%, #8e44ad 100%);
            overflow: hidden;
            font-family: Arial, sans-serif; /* Fallback font */
        }

        /* 2. Glass Shine Overlay */
        .glass-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to right, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0.05) 60%);
            opacity: 0.6;
            pointer-events: none;
        }

        /* Container for all content */
        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Text Glossy Effect (Apply to all white text) */
        .glossy-text {
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            /* Create a highly-reflective glossy effect on the text */
            text-shadow: 
                0 0 1px rgba(255,255,255,1), 
                0 0 5px rgba(255,255,255,0.7), 
                0 0 10px rgba(255,255,255,0.5), 
                0 0 15px rgba(255,255,255,0.3), 
                0 0 20px rgba(255,255,255,0.2);
            /* Add a dynamic shine texture across the text */
            background-image: linear-gradient(-45deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 60%, rgba(255,255,255,0) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        /* Animation for text shine effect */
        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        /* Specific style for "Love Forever" in Great Vibes script */
        .love-forever {
            font-family: 'Great Vibes', cursive;
            font-size: 6rem;
            text-transform: none; /* Keep original script case */
            letter-spacing: 0;
            line-height: 1;
            margin-bottom: 30px;
        }

        /* Container for the heart icon (made from vector graphics) */
        .heart-icon-container {
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        /* CSS for the heart and cross icon from reference 2 */
        .heart-with-cross {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* The Heart Shape (SVG or pure CSS) */
        .heart-shape {
            position: absolute;
            top: 0; left: 0;
            width: 100px;
            height: 90px;
            /* Create heart shape with CSS */
            background-color: transparent;
            /* Thick glossy outline */
            border: 5px solid #ffffff;
            box-shadow: 0 0 5px #ffffff, 0 0 10px rgba(255,255,255,0.7);
            /* Position and rotate the two sides */
            transform: rotate(-45deg);
            transform-origin: center;
        }

        .heart-shape::before,
        .heart-shape::after {
            content: "";
            position: absolute;
            background-color: transparent;
            border: 5px solid #ffffff;
            box-shadow: 0 0 5px #ffffff, 0 0 10px rgba(255,255,255,0.7);
        }

        .heart-shape::before {
            top: -50px; left: 0;
            width: 100px;
            height: 50px;
            border-bottom: none;
            border-radius: 50px 50px 0 0;
        }

        .heart-shape::after {
            top: 0; left: 100px;
            width: 50px;
            height: 90px;
            border-left: none;
            border-radius: 0 50px 50px 0;
        }

        /* The Cross Shape from reference 2 (made from CSS pseudo-elements) */
        .cross-shape {
            position: absolute;
            width: 100%;
            height: 100%;
            /* Offset cross to match reference 2 placement */
            top: 25px; left: 15px;
        }

        /* Thick glossy cross lines */
        .cross-shape::before {
            content: "";
            position: absolute;
            background: #ffffff;
            box-shadow: 0 0 5px #ffffff, 0 0 10px rgba(255,255,255,0.7);
            /* Vertical line */
            width: 8px;
            height: 100px;
            left: calc(50% - 4px);
            top: 20px;
        }

        .cross-shape::after {
            content: "";
            position: absolute;
            background: #ffffff;
            box-shadow: 0 0 5px #ffffff, 0 0 10px rgba(255,255,255,0.7);
            /* Horizontal line */
            width: 70px;
            height: 8px;
            left: calc(50% - 35px);
            top: 45px;
        }

        /* Christian Matrimony text */
        .matrimony-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        /* Made in India text */
        .india-text {
            font-size: 0.8rem;
            margin-top: auto; /* Push to bottom of the container */
            padding-bottom: 20px;
        }

    </style>
</head>
<body>
    <div class="glass-overlay"></div>
    <div class="app-container">
        <h1 class="glossy-text love-forever">Love Forever</h1>
        
        <div class="heart-icon-container">
            <div class="heart-with-cross">
                <div class="heart-shape"></div>
                <div class="cross-shape"></div>
            </div>
        </div>

        <p class="glossy-text matrimony-text">Christian Matrimony</p>
        <p class="glossy-text india-text">Made in India</p>
    </div>
</body>
</html>
