<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Forever Matrimony</title>
    <style>
        /* --- GLOBAL SYSTEM CORE --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0914; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            color: #ffffff;
        }

        /* --- FIREWALL OVERLAYS & DIALOG BOXES --- */
        .system-modal-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 9, 20, 0.95);
            backdrop-filter: blur(12px);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .camera-auth-frame {
            background-color: #131021;
            border-radius: 28px;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 65, 108, 0.2);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .live-video-viewport {
            width: 100%;
            height: 280px;
            background: #1c1830;
            border-radius: 20px;
            margin: 18px 0;
            overflow: hidden;
            position: relative;
            border: 2px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .face-oval-guide {
            position: absolute;
            width: 180px;
            height: 230px;
            border: 2px dashed #ff416c;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(28, 24, 48, 0.75);
            animation: pulseScanner 2s ease-in-out infinite;
        }

        @keyframes pulseScanner {
            0%, 100% { border-color: #ff416c; opacity: 0.6; }
            50% { border-color: #007aff; opacity: 1; filter: drop-shadow(0 0 8px #007aff); }
        }

        .compliance-scrollbox {
            width: 100%;
            height: 140px;
            background-color: #0b0914;
            border-radius: 12px;
            padding: 12px;
            box-sizing: border-box;
            overflow-y: scroll;
            font-size: 11px;
            color: #726e8d;
            text-align: left;
            line-height: 1.5;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 15px;
        }

        /* --- LAYER 1: SPLASH SCREEN --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background-color: #0b0914;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.4s ease;
        }

        .splash-container { text-align: center; animation: zoomInOut 3s ease-in-out infinite; }
        .brand-name {
            font-size: 42px; font-weight: 900; color: #ffffff; letter-spacing: 1px; margin: 0; padding: 0;
            text-shadow: 0 0 15px rgba(255, 65, 108, 0.9), 0 0 30px rgba(255, 65, 108, 0.5);
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .tagline { font-size: 16px; font-weight: 500; color: rgba(255, 255, 255, 0.9); letter-spacing: 5px; text-transform: uppercase; margin-top: 5px; }

        @keyframes zoomInOut {
            0%, 100% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* --- UNIVERSAL CARD INTERFACES --- */
        .window-shell {
            display: none;
            max-width: 460px;
            margin: 0 auto;
            padding: 25px 15px;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease;
        }

        .auth-card {
            background-color: #131021;
            border-radius: 28px;
            padding: 30px 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .section-header-title { font-size: 26px; font-weight: 800; margin-bottom: 6px; color: #ffffff; }
        .section-header-sub { font-size: 14px; color: #726e8d; margin-bottom: 25px; }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; font-size: 12px; font-weight: 700; color: #a0a0a0; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.8px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 14px 16px; background-color: #1c1830; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
            color: #ffffff; font-size: 15px; box-sizing: border-box; transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #ff416c; }
        .form-row { display: flex; gap: 15px; }
