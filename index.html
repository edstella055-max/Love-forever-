<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Forever Matrimony</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0914; /*Premium English Mustard Colour*/
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            /* Smooth Zoom In and Zoom Out Animation */
            animation: zoomInOut 4s ease-in-out infinite; 
        }

        /* Main Brand Name styling */
        .brand-name {
            font-size: 42px;
            font-weight: 900; /* Extra Bold */
            color: #ffffff;
            letter-spacing: 1px;
            margin: 0;
            padding: 0;
            /* Soft red glow effect (Love in the air vibe) */
            text-shadow: 0 0 15px rgba(255, 65, 108, 0.8), 0 0 30px rgba(255, 65, 108, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        /* Small Matrimony text underneath */
        .tagline {
            font-size: 16px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 5px;
            text-shadow: 0 0 8px rgba(255, 65, 108, 0.3);
        }

        /* SVG Outline Symbols container */
        .symbol-svg {
            width: 32px;
            height: 32px;
            display: inline-block;
            vertical-align: middle;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }

        .symbol-svg path {
            fill: none; /* No color inside */
            stroke: #ffffff; /* Sharp white outline */
            stroke-width: 2px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Zoom In and Zoom Out Keyframe Animation Rules */
        @keyframes zoomInOut {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.1); /* Zoom In */
                opacity: 1;
            }
            100% {
                transform: scale(0.8); /* Zoom Out */
                opacity: 0.5;
            }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <h1 class="brand-name">
            Love Forever 
            
            <svg class="symbol-svg" viewBox="0 0 24 24">
                <path d="M12 2v20M7 9h10"/>
            </svg>

            <svg class="symbol-svg" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </h1>
        
        <div class="tagline">Matrimony</div>
    </div>

</body>
</html>
