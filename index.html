<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Forever - Home Screen</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Changed background to Pastel Sage Green from the cake photo */
            background-color: #d1dfcf; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            color: #ffffff;
        }

        /* Home Container */
        .home-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            padding-bottom: 40px;
        }

        /* App Name Styling */
        .app-name {
            font-size: 3rem;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.15);
            animation: zoomInOut 4s ease-in-out infinite;
            color: #ffffff;
        }

        /* Logo Container (Heart with Cross) */
        .logo-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 25px;
            animation: zoomInOut 4s ease-in-out infinite;
        }

        /* Neon Heart Shape */
        .heart {
            position: absolute;
            width: 85px;
            height: 85px;
            background-color: #ff2a6d;
            top: 20px;
            left: 20px;
            transform: rotate(-45deg);
            box-shadow: 0 0 20px #ff2a6d, 0 0 40px #ff2a6d;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 85px;
            height: 85px;
            background-color: #ff2a6d;
            border-radius: 50%;
        }

        .heart::before {
            top: -42px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 42px;
        }

        /* Cross inside the Heart */
        .cross {
            position: absolute;
            z-index: 10;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 50px;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .cross::after {
            content: "";
            position: absolute;
            top: 12px;
            left: -15px;
            width: 42px;
            height: 12px;
            background-color: #ffffff;
        }

        /* Cake Image Block Styling */
        .cake-container {
            width: 90%;
            margin-bottom: 25px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border: 3px solid #ffffff;
        }

        .cake-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Subtitle Highlights (Yellow Tags kept exactly same) */
        .highlight-box {
            background-color: #ffeb3b;
            color: #333333;
            padding: 5px 15px;
            font-weight: bold;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }

        .subtitle-main {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .subtitle-sub {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ZOOM IN ZOOM OUT ANIMATION */
        @keyframes zoomInOut {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.12);
            }
        }
    </style>
</head>
<body>

    <div class="home-container">
        <h1 class="app-name">Love Forever</h1>

        <div class="logo-container">
            <div class="heart"></div>
            <div class="cross"></div>
        </div>

        <div class="cake-container">
            <img src="wedding_cake.jpg" alt="Wedding Cake" class="cake-image">
        </div>

        <div>
            <div class="highlight-box subtitle-main">
                Christian Matrimony
            </div>
        </div>
        
        <div style="height: 10px;"></div> <div>
            <div class="highlight-box subtitle-sub">
                Made in India
            </div>
        </div>
    </div>

</body>
</html>
