<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Love Forever - Christian Matrimony</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 50% 35%, #de106b 0%, #a6004c 50%, #540026 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            padding: 40px 20px;
        }

        .app-viewport {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            max-width: 400px;
            gap: 25px;
            position: relative;
        }

        /* --- STAGE ANIMATIONS --- */

        @keyframes premiumZoomInOut {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.05); }
            100% { transform: scale(0.9); }
        }

        @keyframes corePulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(255,255,255,0.7)); }
            30% { transform: scale(1.06); filter: drop-shadow(0 0 16px rgba(255, 105, 180, 0.8)); }
            60% { transform: scale(1.02); filter: drop-shadow(0 0 10px rgba(255,255,255,0.7)); }
        }

        @keyframes metallicGoldShine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- SPLASH PRESENTATION SCREEN --- */
        #splash-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .title-container {
            width: 100%;
            text-align: center;
            animation: premiumZoomInOut 4.5s ease-in-out infinite;
        }

        .brand-heading {
            font-family: 'Great Vibes', cursive;
            font-size: min(15vw, 4.8rem); /* Bolder and slightly larger screen presence */
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            line-height: 1.1;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.95),
                0 0 25px rgba(255, 20, 147, 0.85),
                0 0 50px rgba(255, 20, 147, 0.4);
        }

        .graphic-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: corePulseGlow 3.5s ease-in-out infinite;
        }

        .faith-heart-svg {
            width: min(32vw, 135px);
            height: min(32vw, 135px);
        }

        .gold-subtitle {
            font-size: min(4.2vw, 1.1rem);
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
            background: linear-gradient(to right, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: metallicGoldShine 4s linear infinite;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.3));
            margin-bottom: 5px;
        }

        /* Lighter, lifted layout configurations */
        .gold-footer {
            font-size: min(3.2vw, 0.78rem);
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 25px; /* Lifted upwards safely away from margins */
            background: linear-gradient(to right, #ddc185 0%, #ffffff 50%, #b89754 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: metallicGoldShine 3s linear infinite;
            filter: drop-shadow(0px 1px 3px rgba(0, 0, 0, 0.2));
            transition: opacity 0.5s ease;
        }

        /* --- INTERACTIVE ACCESS PORTAL (LOGIN) --- */
        #login-stage {
            position: absolute;
            width: 100%;
            padding: 24px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* State triggers controlled cleanly via Javascript */
        .portal-active #splash-stage {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        .portal-active #login-stage {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .login-header-group {
            text-align: center;
            margin-bottom: 5px;
        }

        .login-header-group h3 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .login-header-group p {
            font-size: 0.85rem;
            color: #ffbccc;
            font-weight: 500;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .input-wrapper label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding-left: 4px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Toggle key mask visibility layout */
        .password-toggle-icon {
            position: absolute;
            right: 16px;
            top: 36px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            user-select: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #ffffff;
            color: #a6004c;
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
        }

        .action-button:active {
            transform: translateY(0);
        }

        .action-footer-link {
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 5px;
        }

        .action-footer-link span {
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body onclick="activateLoginScreen()"> <div class="app-viewport" id="master-stage-container">
        
        <div id="splash-stage">
            <div class="title-container">
                <h1 class="brand-heading">Love Forever</h1>
            </div>

            <div class="graphic-wrapper">
                <svg class="faith-heart-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="neon-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="2.5" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5" filter="url(#neon-glow-filter)">
                        <path d="M 45,35 
                                 C 45,15 15,12 15,38 
                                 C 15,62 48,88 56,98 
                                 C 62,88 95,65 102,45 
                                 C 110,20 80,10 65,30 
                                 C 58,40 54,52 54,72" />
                        <path d="M 38,55 L 72,55" />
                    </g>
                </svg>
            </div>

            <h2 class="gold-subtitle">Christian Matrimony</h2>
        </div>

        <div id="login-stage" onclick="event.stopPropagation();">
            <div class="login-header-group">
                <h3>Welcome Back</h3>
                <p>Find your eternal verification match</p>
            </div>

            <form id="auth-gate-form" onsubmit="handleFormSubmission(event)">
                <div style="display: flex; flex-direction: column; gap: 16px;">
                    <div class="input-wrapper">
                        <label for="user-email">Email Address</label>
                        <input type="email" id="user-email" class="input-field" placeholder="name@example.com" required>
                    </div>

                    <div class="input-wrapper">
                        <label for="user-password">Password</label>
                        <input type="password" id="user-password" class="input-field" placeholder="••••••••" required>
                        <span class="password-toggle-icon" id="toggle-visibility-key" onclick="togglePasswordSecurityMask()">Show</span>
                    </div>

                    <button type="submit" class="action-button">Login Access</button>
                </div>
            </form>

            <div class="action-footer-link">
                Don't have an account? <span>Register Here</span>
            </div>
        </div>
        
    </div>

    <div class="gold-footer" id="base-footer">
        Made in India
    </div>

    <script>
        // Automatic timed trigger transitioning splash to interactive form field layout
        const autoTransitionTimer = setTimeout(() => {
            activateLoginScreen();
        }, 4000); // Transitions safely after 4 seconds automatically

        function activateLoginScreen() {
            // Cancel automatic timer if user clicked manually to prevent conflicts
            clearTimeout(autoTransitionTimer);
            
            // Apply visual transition toggle classes
            document.getElementById('master-stage-container').classList.add('portal-active');
        }

        // Toggle Password Visibility Input mask safely
        function togglePasswordSecurityMask() {
            const passwordInputField = document.getElementById('user-password');
            const toggleTextButton = document.getElementById('toggle-visibility-key');
            
            if (passwordInputField.type === 'password') {
                passwordInputField.type = 'text';
                toggleTextButton.textContent = 'Hide';
            } else {
                passwordInputField.type = 'password';
                toggleTextButton.textContent = 'Show';
            }
        }

        // Handle basic access control logic checking fields smoothly
        function handleFormSubmission(event) {
            event.preventDefault();
            const emailValue = document.getElementById('user-email').value;
            alert('Access verified securely for: ' + emailValue);
        }
    </script>

</body>
