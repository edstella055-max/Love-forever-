<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Forever - Home Screen</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #ff758c 0%, #ff7eb3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            color: #ffffff;
        }

        /* Home Container */
        .home-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            padding-bottom: 40px;
        }

        /* App Name Styling */
        .app-name {
            font-size: 3rem;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            animation: zoomInOut 4s ease-in-out infinite;
        }

        /* Logo Container (Heart with Cross) */
        .logo-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 25px;
            animation: zoomInOut 4s ease-in-out infinite;
        }

        .heart {
            position: absolute;
            width: 85px;
            height: 85px;
            background-color: #ff2a6d;
            top: 20px;
            left: 20px;
            transform: rotate(-45deg);
            box-shadow: 0 0 20px #ff2a6d, 0 0 40px #ff2a6d;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 85px;
            height: 85px;
            background-color: #ff2a6d;
            border-radius: 50%;
